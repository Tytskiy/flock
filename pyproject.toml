[project]
name = "flock"
version = "0.1.0"
description = "Learn distributed collectives in pure Python, no GPU"
readme = "README.md"
authors = [
    { name = "Vladislav Tytskiy", email = "vladtytskiy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/typing"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
