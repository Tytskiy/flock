name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --locked

      - name: Check
        run: just check

      - name: Test
        run: just test
